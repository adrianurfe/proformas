<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proformas</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sw:260px;--bg:#f5f5f3;--white:#fff;
  --ink:#111110;--ink2:#3a3a38;--ink3:#6b6b69;--ink4:#a0a09e;
  --border:1px solid #e4e4e0;
  --sb:#141413;--sb-b:#242422;--sb-t:#888886;
  --green:#1d5c38;--r:6px;
}
html,body{height:100%;font-family:'Montserrat',sans-serif;font-size:13px;background:var(--bg);color:var(--ink);display:flex;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sw);background:var(--sb);display:flex;flex-direction:column;height:100vh;flex-shrink:0;border-right:1px solid var(--sb-b)}
.sb-head{padding:22px 20px 18px;border-bottom:1px solid var(--sb-b);flex-shrink:0}
.sb-head .lbl{font-size:9px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:#333331;margin-bottom:2px}
.sb-head .ttl{font-size:15px;font-weight:700;color:#fff}
.btn-new{margin:12px 14px;display:flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;color:var(--ink);border:none;border-radius:var(--r);font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;flex-shrink:0}
.btn-new:hover{background:#e8e8e4}
.sb-scroll{flex:1;overflow-y:auto;padding:4px 0 16px}
.sb-scroll::-webkit-scrollbar{width:3px}
.sb-scroll::-webkit-scrollbar-thumb{background:#2a2a28;border-radius:2px}
.sb-sec{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#2e2e2c;padding:12px 20px 6px}
.sb-proj{margin:2px 8px;border-radius:var(--r)}
.sb-ph{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;border-radius:var(--r);transition:background .12s}
.sb-ph:hover{background:rgba(255,255,255,.05)}
.sb-ph.open{background:rgba(255,255,255,.08)}
.sb-pn{font-size:12px;font-weight:500;color:#aaa;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-ph.open .sb-pn{color:#fff}
.sb-chev{color:#3a3a38;transition:transform .2s;flex-shrink:0;margin-left:4px}
.sb-ph.open .sb-chev{transform:rotate(90deg);color:#666}
.sb-del{display:none;background:none;border:none;cursor:pointer;color:#444;padding:2px 3px;border-radius:3px;flex-shrink:0}
.sb-ph:hover .sb-del{display:flex}
.sb-del:hover{color:#e07070}
.sb-sub{display:none;padding:2px 0 4px}
.sb-sub.open{display:block}
.sb-si{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 26px;cursor:pointer;font-size:11px;color:var(--sb-t);border-radius:5px;margin:1px 8px;transition:background .12s,color .12s;border-left:2px solid transparent}
.sb-si:hover{color:#ccc;background:rgba(255,255,255,.04)}
.sb-si.active{color:#fff;font-weight:500;border-left-color:#fff;background:rgba(255,255,255,.07)}
.sb-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0}
.sb-si.active .sb-dot{opacity:1}
.sb-empty{padding:12px 20px;font-size:11px;color:#3a3a38;font-style:italic}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--white);border-bottom:var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;flex-shrink:0}
.tb-left{display:flex;align-items:center;gap:8px}
.tb-crumb{font-size:12px;color:var(--ink3)}
.tb-crumb.cur{color:var(--ink);font-weight:600}
.tb-sep{color:var(--ink4)}
.save-status{font-size:11px;color:var(--ink4);display:flex;align-items:center;gap:6px}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--ink4);animation:pulse 1s infinite;display:none}
.save-dot.show{display:block}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.content{flex:1;overflow-y:auto;padding:28px 32px 80px}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--ink3)}
.empty svg{margin-bottom:14px;opacity:.2}
.empty h2{font-size:15px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.empty p{font-size:12px;max-width:280px;line-height:1.6}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);border:var(--border);border-radius:var(--r);overflow:hidden;background:#e4e4e0;margin-bottom:22px}
.kc{background:var(--white);padding:16px 18px;border-right:var(--border)}
.kc:last-child{border-right:none}
.kc .kl{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink4);margin-bottom:5px}
.kc .kv{font-size:19px;font-weight:700;color:var(--ink);line-height:1}
.kc .kv.g{color:var(--green)}
.kc .ks{font-size:10px;color:var(--ink4);margin-top:3px}

/* GRID */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.card{background:var(--white);border:var(--border);border-radius:var(--r);padding:20px 22px}
.card-full{background:var(--white);border:var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:18px}
.ct{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--ink4);margin-bottom:14px;padding-bottom:10px;border-bottom:var(--border)}

/* EDITABLE TABLE */
.etbl{width:100%;border-collapse:collapse}
.etbl th{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--ink4);text-align:left;padding:5px 8px 7px;border-bottom:var(--border)}
.etbl th.r{text-align:right}
.etbl td{padding:3px 6px;border-bottom:1px solid #f0f0ec;font-size:12px;vertical-align:middle}
.etbl td.label{color:var(--ink2);padding-left:8px}
.etbl td.computed{text-align:right;font-weight:600;color:var(--ink);padding-right:8px;white-space:nowrap}
.etbl td.ref{text-align:right;font-size:11px;color:var(--ink4);padding-right:8px}
.etbl td.pct-col{text-align:right;color:var(--ink4);font-size:11px;padding-right:8px;width:65px;white-space:nowrap}
.etbl tr:last-child td{border-bottom:none}
.etbl .tg td{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink4);padding:10px 8px 3px;border-bottom:none;background:transparent}
.etbl .ts td{background:#f5f5f3;font-weight:700;border-top:var(--border);font-size:12px}
.etbl .tt td{background:var(--ink);color:#fff;font-weight:700}
.etbl .tu td{background:var(--green);color:#fff;font-weight:700}

/* INPUT */
.ef{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:500;border:1px solid transparent;border-radius:4px;padding:4px 7px;color:var(--ink);background:transparent;text-align:right;width:100%;transition:all .15s;-moz-appearance:textfield}
.ef::-webkit-outer-spin-button,.ef::-webkit-inner-spin-button{-webkit-appearance:none}
.ef:hover{border-color:#e4e4e0;background:#fafaf8}
.ef:focus{border-color:#aaa;background:#fff;outline:none;box-shadow:0 0 0 2px rgba(0,0,0,.06)}
.ef.left{text-align:left}
.bar{display:inline-block;height:4px;background:var(--ink3);border-radius:1px;vertical-align:middle;margin-right:4px;opacity:.25}

/* TIPOS TABLE */
.tipo-table{width:100%;border-collapse:collapse;margin-bottom:10px}
.tipo-table th{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--ink4);padding:5px 8px 8px;border-bottom:var(--border);text-align:right}
.tipo-table th:first-child{text-align:left}
.tipo-table td{padding:4px 6px;border-bottom:1px solid #f0f0ec;vertical-align:middle;text-align:right}
.tipo-table td:first-child{text-align:left}
.tipo-table tr:last-child td{border-bottom:none}
.tipo-total{font-size:12px;font-weight:600;color:var(--ink)}
.btn-add{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;padding:6px 12px;border:var(--border);border-radius:5px;background:transparent;color:var(--ink3);cursor:pointer;margin-top:8px}
.btn-add:hover{background:#f5f5f3}
.btn-rm{background:none;border:none;cursor:pointer;color:#ccc;font-size:16px;padding:0 4px;line-height:1;transition:color .15s}
.btn-rm:hover{color:#e07070}

/* FLUJO */
.fl-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.fl-toolbar label{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink4)}
.fl-toolbar select{font-family:'Montserrat',sans-serif;font-size:11px;background:var(--white);border:var(--border);border-radius:5px;padding:6px 10px;color:var(--ink);cursor:pointer}
.legend{display:flex;gap:14px;margin-bottom:10px}
.li{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--ink4);font-weight:500}
.ld{width:10px;height:10px;border-radius:2px}
.chart-card{background:var(--white);border:var(--border);border-radius:var(--r);padding:18px 22px;margin-bottom:18px;height:195px;position:relative}
.chart-card canvas{width:100%!important;height:100%!important}
.fw{overflow-x:auto;background:var(--white);border:var(--border);border-radius:var(--r)}
.ft{border-collapse:collapse;font-size:11px;white-space:nowrap}
.ft th{background:var(--ink);color:#555;padding:8px 13px;text-align:right;font-weight:500;font-size:9px;position:sticky;top:0}
.ft th:first-child{text-align:left;min-width:185px;position:sticky;left:0;z-index:2;background:var(--ink)}
.ft td{padding:6px 13px;text-align:right;border-bottom:1px solid #f0f0ec}
.ft td:first-child{text-align:left;font-size:10px;font-weight:500;background:#f7f7f5;position:sticky;left:0;color:var(--ink2);border-right:var(--border)}
.ft .frs td{background:#1a1a18}.ft .frs td:first-child{background:#1a1a18;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#333;border-right:1px solid #252523}
.ft .fri td{background:#f0f7f3}
.ft .fre td{background:#fdf4f4}
.ft .frn td{background:var(--ink);color:#888;font-weight:600}
.ft .frn td.pos{color:#6fcf97}.ft .frn td.neg{color:#e07070}
.ft .fra td{background:#0d0d0c;color:#444;font-weight:600}
.ft .fra td:first-child{background:#0d0d0c;border-right:1px solid #1a1a18}
.ft .fra td.pos{color:#6fcf97}.ft .fra td.neg{color:#e07070}
.sum-row{display:grid;grid-template-columns:repeat(4,1fr);border:var(--border);border-radius:var(--r);overflow:hidden;background:#e4e4e0;margin-top:18px}
.src{background:var(--white);padding:14px 16px;border-right:var(--border)}
.src:last-child{border-right:none}
.src .sl{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink4);margin-bottom:4px}
.src .sv{font-size:15px;font-weight:700;color:var(--ink)}
.src .sv.g{color:var(--green)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--r);font-size:12px;font-weight:500;z-index:999;opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{background:#8b2e2e}

/* MODALS */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:8px;padding:26px;width:360px;box-shadow:0 16px 48px rgba(0,0,0,.2)}
.modal h3{font-size:15px;font-weight:700;margin-bottom:6px}
.modal p{font-size:12px;color:var(--ink3);line-height:1.5;margin-bottom:18px}
.modal-row{margin-bottom:14px}
.modal-row label{display:block;font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.modal-row input,.modal-row select{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:500;border:var(--border);border-radius:6px;padding:9px 11px;color:var(--ink);width:100%}
.modal-row input:focus,.modal-row select:focus{outline:none;border-color:#999}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.btn-cancel{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;padding:8px 14px;border:var(--border);border-radius:5px;background:transparent;color:var(--ink3);cursor:pointer}
.btn-confirm{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;padding:8px 18px;border:none;border-radius:5px;background:var(--ink);color:#fff;cursor:pointer}
.btn-danger{background:#8b2e2e}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-head">
    <div class="lbl">Plataforma</div>
    <div class="ttl">Proformas</div>
  </div>
  <button class="btn-new" onclick="openNewProject()">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Nuevo proyecto
  </button>
  <div class="sb-scroll">
    <div class="sb-sec">Proyectos</div>
    <div id="projList"><div class="sb-empty">Cargando...</div></div>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="tb-left" id="tbCrumb"><span class="tb-crumb cur">Selecciona un proyecto</span></div>
    <div class="save-status"><div class="save-dot" id="saveDot"></div><span id="saveText"></span></div>
  </div>
  <div class="content" id="contentArea">
    <div class="empty">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><rect x="5" y="7" width="34" height="30" rx="3" stroke="#111" stroke-width="2"/><path d="M12 17h20M12 23h20M12 29h11" stroke="#111" stroke-width="2" stroke-linecap="round"/></svg>
      <h2>Sin proyecto seleccionado</h2>
      <p>Elige un proyecto del sidebar o crea uno nuevo.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- NEW PROJECT -->
<div class="overlay" id="npOverlay" onclick="if(event.target===this)closeNewProject()">
  <div class="modal">
    <h3>Nuevo proyecto</h3>
    <p>La proforma se abre en blanco lista para llenar.</p>
    <div class="modal-row"><label>Nombre</label><input type="text" id="np-name" placeholder="Ej. Torre Andares" onkeydown="if(event.key==='Enter')createNewProject()"></div>
    <div class="modal-row"><label>Escenario</label><select id="np-esc"><option>Conservador</option><option>Moderado</option><option>Optimista</option></select></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeNewProject()">Cancelar</button>
      <button class="btn-confirm" onclick="createNewProject()">Crear →</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="overlay" id="delOverlay">
  <div class="modal">
    <h3>Eliminar proyecto</h3>
    <p id="delMsg"></p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeDelete()">Cancelar</button>
      <button class="btn-confirm btn-danger" onclick="confirmDelete()">Eliminar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
const SUPA_URL = 'https://ppdyogtveiltxzymdxsa.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZHlvZ3R2ZWlsdHh6eW1keHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODU2NjAsImV4cCI6MjA5NTY2MTY2MH0.Ard8M1RILsSXUILV8z7tq8fPXUhFFSMdPhm5Cgjk6pg';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

let projects=[], activeProjId=null, activeView='resumen';
let chartInst=null, saveTimer=null, deleteTargetId=null, tipoIdCounter=0;

// ── HELPERS ──
const $ = id => document.getElementById(id);
const nv = id => parseFloat($(id)?.value) || 0;
const fmt = v => {
  if(!v||v===0) return '—';
  const s=v<0?'-':'', a=Math.abs(v);
  if(a>=1e6) return s+'$'+(a/1e6).toFixed(2)+'M';
  if(a>=1e3) return s+'$'+Math.round(a/1000).toLocaleString()+'K';
  return s+'$'+Math.round(a).toLocaleString();
};
const fmtN = v => v ? Math.round(v).toLocaleString() : '—';
const fmtPct = (v,t) => t ? ((v/t)*100).toFixed(2)+'%' : '—';
const bw = (v,t) => t ? Math.min(Math.round((Math.abs(v)/t)*120),120) : 0;
const set = (id,v) => { const el=$(id); if(el) el.textContent=v; };

function toast(msg,type='ok'){
  const el=$('toast'); el.textContent=msg;
  el.className='toast show'+(type==='err'?' err':'');
  setTimeout(()=>el.className='toast',3000);
}
function setSave(s){
  const dot=$('saveDot'), txt=$('saveText');
  if(s==='saving'){dot.classList.add('show');txt.textContent='Guardando...';}
  else if(s==='saved'){dot.classList.remove('show');txt.textContent='Guardado ✓';}
  else{dot.classList.remove('show');txt.textContent='';}
}

// ── SUPABASE ──
async function loadProjects(){
  const {data,error}=await supa.from('projects').select('*').order('created_at',{ascending:true});
  if(error){toast('Error al cargar','err');return;}
  projects=data||[];
  renderSidebar();
}

// ── SIDEBAR ──
function renderSidebar(){
  const list=$('projList'); list.innerHTML='';
  if(!projects.length){list.innerHTML='<div class="sb-empty">Sin proyectos aún</div>';return;}
  projects.forEach(p=>{
    const isOpen=activeProjId===p.id;
    const div=document.createElement('div');
    div.className='sb-proj';
    div.innerHTML=`
      <div class="sb-ph ${isOpen?'open':''}" onclick="toggleProj('${p.id}')">
        <span class="sb-pn">${p.name}</span>
        <div style="display:flex;align-items:center;gap:3px">
          <button class="sb-del" onclick="event.stopPropagation();openDelete('${p.id}','${(p.name||'').replace(/'/g,"\\'")}')">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M4.5 3V2h3v1M5 5v4M7 5v4M2.5 3l.5 6.5h6L9.5 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <svg class="sb-chev" width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M3.5 1.5l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="sb-sub ${isOpen?'open':''}">
        <div class="sb-si ${isOpen&&activeView==='resumen'?'active':''}" onclick="goTo('${p.id}','resumen')"><span class="sb-dot"></span>Resumen Ejecutivo</div>
        <div class="sb-si ${isOpen&&activeView==='flujo'?'active':''}" onclick="goTo('${p.id}','flujo')"><span class="sb-dot"></span>Flujo Financiero</div>
      </div>`;
    list.appendChild(div);
  });
}

function toggleProj(id){
  if(activeProjId===id){activeProjId=null;renderSidebar();showEmpty();}
  else{activeProjId=id;activeView='resumen';renderSidebar();renderView();}
}
function goTo(id,view){activeProjId=id;activeView=view;renderSidebar();renderView();}
function showEmpty(){
  $('tbCrumb').innerHTML='<span class="tb-crumb cur">Selecciona un proyecto</span>';
  setSave('');
  $('contentArea').innerHTML='<div class="empty"><svg width="44" height="44" viewBox="0 0 44 44" fill="none"><rect x="5" y="7" width="34" height="30" rx="3" stroke="#111" stroke-width="2"/><path d="M12 17h20M12 23h20M12 29h11" stroke="#111" stroke-width="2" stroke-linecap="round"/></svg><h2>Sin proyecto seleccionado</h2><p>Elige un proyecto del sidebar o crea uno nuevo.</p></div>';
}

// ── CALC ──────────────────────────────────────────────────────────
function calc(){
  const tipos = getTipos();

  // SUPERFICIES
  const terrM2    = nv('f-t-m2');
  const cus       = nv('f-t-cus') || 3.2;
  const amenPct   = nv('f-t-amen') / 100;
  const m2Total   = terrM2 * cus;
  const m2Amenidad= m2Total * amenPct;
  const m2Vendible= m2Total - m2Amenidad;

  // ESTACIONAMIENTO: cajones = suma(cajones/unidad × unidades por tipo)
  const eCajonM2  = nv('f-e-m2') || 35;
  const eCajones  = tipos.reduce((a,t)=>a+(t.cajones||0)*t.n, 0);
  const m2Estac   = eCajones * eCajonM2;

  // VENTAS: solo deptos (unidades × m²/depto × precio/m²)
  const ventasDep = tipos.reduce((a,t)=>a+t.n*t.m2*t.precio, 0);
  const ventas    = ventasDep;
  const units     = tipos.reduce((a,t)=>a+t.n, 0);

  // TERRENO: % sobre ventas
  const terrPct    = nv('f-t-pct') / 100;
  const terrFidPct = nv('f-t-fidpct') / 100;
  const terreno    = ventas * terrPct;
  const fideicomiso= ventas * terrFidPct;
  const terrenoTotal = terreno + fideicomiso;
  const terrRefM2  = terrM2 ? terrenoTotal / terrM2 : 0;

  // CONSTRUCCIÓN
  const cBr        = nv('f-c-br');
  const cDep       = nv('f-c-dep');
  const construcBR = m2Estac * cBr;      // m² estac × $/m²
  const construcDep= m2Total * cDep;     // m² totales × $/m²
  const construc   = construcBR + construcDep;

  // PRELIMINARES
  const est  = construc * nv('f-c-est')  / 100;  // sobre construcción
  const gest = ventas   * nv('f-c-gest') / 100;  // sobre ventas
  const fia  = ventas   * nv('f-c-fia')  / 100;  // sobre ventas
  const sia  = ventas   * nv('f-c-sia')  / 100;  // sobre ventas
  const prelim = est+gest+fia+sia;

  // COSTO FIJO — sobre construcción
  const pe   = construc * nv('f-c-pe')   / 100;
  const ind  = construc * nv('f-c-ind')  / 100;
  const leg  = construc * nv('f-c-leg')  / 100;
  const imp  = construc * nv('f-c-imp')  / 100;
  const mant = construc * nv('f-c-mant') / 100;
  // COSTO FIJO — sobre ventas
  const pm   = ventas * nv('f-c-pm')  / 100;
  const mkt  = ventas * nv('f-c-mkt') / 100;
  const com  = ventas * nv('f-c-com') / 100;
  const gv   = ventas * nv('f-c-gv')  / 100;
  const cfijo = pe+ind+leg+imp+mant+pm+mkt+com+gv;

  // TOTALES
  const costo = terrenoTotal+prelim+construc+cfijo;
  const util  = ventas-costo;

  // FINANCIERO
  const cap      = nv('f-v-cap');
  const banco    = nv('f-v-banco');
  const tasa     = nv('f-g-tasa')||14;
  const meses    = nv('f-g-meses')||24;
  const costoFin = banco*(tasa/100/12)*meses;
  const utilFin  = util-costoFin;

  return {
    tipos,units,
    terrM2,cus,amenPct,m2Total,m2Amenidad,m2Vendible,
    eCajones,eCajonM2,m2Estac,
    ventas,ventasDep,
    terrPct,terrFidPct,terreno,fideicomiso,terrenoTotal,terrRefM2,
    construcBR,construcDep,construc,
    est,gest,fia,sia,prelim,
    pe,ind,leg,imp,mant,pm,mkt,com,gv,cfijo,
    costo,util,cap,banco,tasa,meses,costoFin,utilFin,
  };
}

function getTipos(){
  return Array.from(document.querySelectorAll('#tipoContainer .tipo-row')).map(row=>{
    const id=row.dataset.id;
    return{
      id,
      label: $('tl-'+id)?.value||'',
      n:     parseFloat($('tn-'+id)?.value)||0,
      m2:    parseFloat($('tm-'+id)?.value)||0,
      precio:parseFloat($('tp-'+id)?.value)||0,
      cajones:parseFloat($('tc-'+id)?.value)||0,
    };
  });
}

// ── UPDATE (live recalc) ──
function updateCalcs(){
  const c=calc();
  // KPIs
  const kmap=[
    ['kpi-ventas', fmt(c.ventas), c.units+' unidades'],
    ['kpi-costo',  fmt(c.costo),  fmtPct(c.costo,c.ventas)+' sobre ventas'],
    ['kpi-util',   fmt(c.util),   fmtPct(c.util,c.ventas)+' margen'],
    ['kpi-inv',    fmt(c.cap+c.banco), 'Capital + Banco'],
    ['kpi-rend',   c.cap+c.banco?fmtPct(c.utilFin,c.cap+c.banco):'—', 'Util. / Inversión'],
  ];
  kmap.forEach(([id,v,s])=>{
    const el=$(id); if(!el)return;
    const vEl=el.querySelector('.kv'), sEl=el.querySelector('.ks');
    if(vEl)vEl.textContent=v; if(sEl)sEl.textContent=s;
  });
  // Tipo subtotals
  getTipos().forEach(t=>{
    const el=$('tt-'+t.id); if(el) el.textContent=fmt(t.n*t.m2*t.precio);
    const ce=$('tc-total-'+t.id); if(ce) ce.textContent=(t.cajones*t.n)||'—';
  });
  // Superficies
  set('calc-m2total',   fmtN(c.m2Total)+' m²');
  set('calc-m2amenidad',fmtN(c.m2Amenidad)+' m²');
  set('calc-m2vendible',fmtN(c.m2Vendible)+' m²');
  set('calc-cajones',   c.eCajones||'—');
  set('calc-m2estac',   fmtN(c.m2Estac)+' m²');
  // Terreno
  set('calc-terreno',    fmt(c.terreno));
  set('calc-terrfid',    fmt(c.fideicomiso));
  set('calc-terrTotal',  fmt(c.terrenoTotal));
  set('calc-terrRefM2',  c.terrRefM2?'$'+Math.round(c.terrRefM2).toLocaleString()+'/m²':'—');
  set('calc-terr-pct',   fmtPct(c.terrenoTotal,c.ventas));
  // Construcción
  set('calc-cbr',      fmt(c.construcBR));  set('calc-cbr-pct',  fmtPct(c.construcBR,c.ventas));
  set('calc-cdep',     fmt(c.construcDep)); set('calc-cdep-pct', fmtPct(c.construcDep,c.ventas));
  set('calc-construc', fmt(c.construc));    set('calc-con-pct',  fmtPct(c.construc,c.ventas));
  // Prelim
  set('calc-est',  fmt(c.est));  set('calc-gest', fmt(c.gest));
  set('calc-fia',  fmt(c.fia));  set('calc-sia',  fmt(c.sia));
  set('calc-prelim',fmt(c.prelim)); set('calc-pre-pct',fmtPct(c.prelim,c.ventas));
  // Costo fijo
  set('calc-pe',   fmt(c.pe));   set('calc-ind',  fmt(c.ind));
  set('calc-leg',  fmt(c.leg));  set('calc-imp',  fmt(c.imp));
  set('calc-mant', fmt(c.mant)); set('calc-pm',   fmt(c.pm));
  set('calc-mkt',  fmt(c.mkt));  set('calc-com',  fmt(c.com));
  set('calc-gv',   fmt(c.gv));
  set('calc-cfijo',fmt(c.cfijo)); set('calc-cf-pct',fmtPct(c.cfijo,c.ventas));
  // Totales
  set('calc-costo',fmt(c.costo)); set('calc-costo-pct',fmtPct(c.costo,c.ventas));
  set('calc-util', fmt(c.util));  set('calc-util-pct', fmtPct(c.util,c.ventas));
  set('calc-costoFin',fmt(c.costoFin));
  set('calc-utilFin', fmt(c.utilFin));
  // Bars
  [['bar-terr',c.terrenoTotal],['bar-pre',c.prelim],['bar-con',c.construc],['bar-cf',c.cfijo]].forEach(([id,v])=>{
    const el=$(id); if(el) el.style.width=bw(v,c.ventas)+'px';
  });
  scheduleSave();
}

}

function renderResumen(p){

  tipoIdCounter=0;

  const terrM2=p.terr_m2||0, cus=p.terr_cus||3.2, amenPct=(p.terr_amen||18)/100;
  const m2Total=terrM2*cus, m2Amenidad=m2Total*amenPct, m2Vendible=m2Total-m2Amenidad;
  const eCajones=tipos.reduce((a,t)=>a+(t.cajones||0)*(t.n||0),0);
  const eCajonM2=p.e_m2||35, m2Estac=eCajones*eCajonM2;
  const ventas=tipos.reduce((a,t)=>a+(t.n||0)*(t.m2||0)*(t.precio||0),0);
  const units=tipos.reduce((a,t)=>a+(t.n||0),0);
  const terrPct=(p.terr_pct||14)/100, terrFidPct=(p.terr_fidpct||0.23)/100;
  const terreno=ventas*terrPct, fideicomiso=ventas*terrFidPct, terrenoTotal=terreno+fideicomiso;

  const construcBR=m2Estac*(p.c_br||0), construcDep=m2Total*(p.c_dep||0), construc=construcBR+construcDep;
  const est=construc*(p.c_est||0)/100, gest=ventas*(p.c_gest||0)/100;
  const fia=ventas*(p.c_fia||0)/100,   sia=ventas*(p.c_sia||0)/100;

  const com=ventas*(p.c_com||0)/100,   gv=ventas*(p.c_gv||0)/100;
  const cfijo=pe+ind+leg+imp+mant+pm+mkt+com+gv;
  const costo=terrenoTotal+prelim+construc+cfijo, util=ventas-costo;
  const cap=p.capital||0, banco=p.banco||0, tasa=p.tasa||14, meses=p.meses||24;
  const costoFin=banco*(tasa/100/12)*meses, utilFin=util-costoFin;

  $('contentArea').innerHTML=`

  <tr><td class="label">Gastos Legales</td><td><input class="ef" type="number" id="f-c-leg" value="${p.c_leg||''}" step="0.01" placeholder="1" oninput="updateCalcs()"></td><td class="computed" id="calc-leg">${fmt(leg)}</td><td class="pct-col">${fmtPct(leg,ventas)}</td></tr>
  <tr><td class="label">Imprevistos</td><td><input class="ef" type="number" id="f-c-imp" value="${p.c_imp||''}" step="0.01" placeholder="1.5" oninput="updateCalcs()"></td><td class="computed" id="calc-imp">${fmt(imp)}</td><td class="pct-col">${fmtPct(imp,ventas)}</td></tr>
  <tr><td class="label">Mantenimiento</td><td><input class="ef" type="number" id="f-c-mant" value="${p.c_mant||''}" step="0.01" placeholder="0.5" oninput="updateCalcs()"></td><td class="computed" id="calc-mant">${fmt(mant)}</td><td class="pct-col">${fmtPct(mant,ventas)}</td></tr>

  <tr class="tg"><td colspan="4">Costo Fijo — % sobre ventas</td></tr>
  <tr><td class="label">Project Management</td><td><input class="ef" type="number" id="f-c-pm" value="${p.c_pm||''}" step="0.01" placeholder="3.48" oninput="updateCalcs()"></td><td class="computed" id="calc-pm">${fmt(pm)}</td><td class="pct-col">${fmtPct(pm,ventas)}</td></tr>
  <tr><td class="label">Marketing</td><td><input class="ef" type="number" id="f-c-mkt" value="${p.c_mkt||''}" step="0.01" placeholder="1.16" oninput="updateCalcs()"></td><td class="computed" id="calc-mkt">${fmt(mkt)}</td><td class="pct-col">${fmtPct(mkt,ventas)}</td></tr>
  <tr><td class="label">Comisiones de Venta</td><td><input class="ef" type="number" id="f-c-com" value="${p.c_com||''}" step="0.01" placeholder="6.96" oninput="updateCalcs()"></td><td class="computed" id="calc-com">${fmt(com)}</td><td class="pct-col">${fmtPct(com,ventas)}</td></tr>
  <tr><td class="label">Gasto de Venta</td><td><input class="ef" type="number" id="f-c-gv" value="${p.c_gv||''}" step="0.01" placeholder="0.5" oninput="updateCalcs()"></td><td class="computed" id="calc-gv">${fmt(gv)}</td><td class="pct-col">${fmtPct(gv,ventas)}</td></tr>
  <tr class="ts"><td class="label" colspan="2">SUBTOTAL</td><td class="computed" id="calc-cfijo">${fmt(cfijo)}</td><td class="pct-col"><span class="bar" id="bar-cf" style="width:${bw(cfijo,ventas)}px"></span><span id="calc-cf-pct">${fmtPct(cfijo,ventas)}</span></td></tr>

  <tr class="tt"><td class="label" style="color:#fff" colspan="2">TOTAL COSTO</td><td class="computed" style="color:#fff" id="calc-costo">${fmt(costo)}</td><td class="pct-col" style="color:#aaa" id="calc-costo-pct">${fmtPct(costo,ventas)}</td></tr>
  <tr class="tu"><td class="label" style="color:#fff" colspan="2">UTILIDAD</td><td class="computed" style="color:#fff" id="calc-util">${fmt(util)}</td><td class="pct-col" style="color:#b8f0ce" id="calc-util-pct">${fmtPct(util,ventas)}</td></tr>
</tbody>
</table>
</div>
</div>

<div class="card-full">
<div class="ct">Tipos de Departamento — Precios de Venta</div>
<table class="tipo-table">
  <thead><tr><th>Tipo</th><th>Unidades</th><th>m²/depto</th><th>$/m²</th><th>Cajones/unidad</th><th>Subtotal Venta</th><th>Total Cajones</th><th></th></tr></thead>
  <tbody id="tipoContainer">${tipoRows}</tbody>

}

// ── TIPO MGMT ──
function addTipo(){
  tipoIdCounter++;
  const tid=tipoIdCounter;
  const tr=document.createElement('tr');
  tr.className='tipo-row'; tr.dataset.id=tid;
  tr.innerHTML=`
    <td><input class="ef left" type="text" id="tl-${tid}" value="" placeholder="Tipo" oninput="updateCalcs()" style="width:100%"></td>
    <td><input class="ef" type="number" id="tn-${tid}" value="" placeholder="0" oninput="updateCalcs()"></td>
    <td><input class="ef" type="number" id="tm-${tid}" value="" placeholder="0" oninput="updateCalcs()"></td>
    <td><input class="ef" type="number" id="tp-${tid}" value="" placeholder="0" oninput="updateCalcs()"></td>
    <td><input class="ef" type="number" id="tc-${tid}" value="" placeholder="1" oninput="updateCalcs()"></td>
    <td class="tipo-total" id="tt-${tid}">—</td>
    <td><span id="tc-total-${tid}" style="font-size:11px;color:var(--ink3)">—</span></td>
    <td><button class="btn-rm" onclick="removeTipo(${tid})">×</button></td>`;

}
function removeTipo(id){
  const el=$('tipoContainer').querySelector(`[data-id="${id}"]`);
  if(el){el.remove();updateCalcs();}
}

// ── NAME ──
function updateName(val){
  const p=projects.find(x=>x.id===activeProjId); if(!p)return;
  p.name=val;
  const el=document.querySelector(`[onclick="toggleProj('${activeProjId}')"] .sb-pn`);
  if(el)el.textContent=val;
  scheduleSave();
}

// ── FLUJO ──
function renderFlujo(p){
  if(chartInst){chartInst.destroy();chartInst=null;}
  const tipos=p.tipos||[];
  const terrM2=p.terr_m2||0, cus=p.terr_cus||3.2, amenPct=(p.terr_amen||18)/100;
  const m2Total=terrM2*cus, m2Amenidad=m2Total*amenPct;
  const eCajones=tipos.reduce((a,t)=>a+(t.cajones||0)*(t.n||0),0);
  const m2Estac=eCajones*(p.e_m2||35);
  const ventas=tipos.reduce((a,t)=>a+(t.n||0)*(t.m2||0)*(t.precio||0),0);
  const terrPct=(p.terr_pct||14)/100, terrFidPct=(p.terr_fidpct||0.23)/100;
  const terrenoTotal=ventas*(terrPct+terrFidPct);
  const construcBR=m2Estac*(p.c_br||0), construcDep=m2Total*(p.c_dep||0), construc=construcBR+construcDep;
  const est=construc*(p.c_est||0)/100, gest=ventas*(p.c_gest||0)/100;
  const fia=ventas*(p.c_fia||0)/100, sia=ventas*(p.c_sia||0)/100;
  const prelim=est+gest+fia+sia;
  const pe=construc*(p.c_pe||0)/100, ind=construc*(p.c_ind||0)/100;
  const leg=construc*(p.c_leg||0)/100, imp=construc*(p.c_imp||0)/100;
  const mant=construc*(p.c_mant||0)/100;
  const pm=ventas*(p.c_pm||0)/100, mkt=ventas*(p.c_mkt||0)/100;
  const com=ventas*(p.c_com||0)/100, gv=ventas*(p.c_gv||0)/100;
  const cfijo=pe+ind+leg+imp+mant+pm+mkt+com+gv;
  const costo=terrenoTotal+prelim+construc+cfijo, util=ventas-costo;
  const cap=p.capital||0, banco=p.banco||0, tasa=p.tasa||14;
  const meses=p.meses||24, vstart=p.vstart||1, vDur=p.v_dur||22;
  const pctCont=(p.pct_contado||30)/100;
  const costoFin=banco*(tasa/100/12)*meses;
  const ecPct=(p.ec_pct||90)/100, wcPct=(p.wc_pct||10)/100;
  const efPct=(p.ef_pct||35)/100, wfPct=(p.wf_pct||65)/100;

  const N=meses+1;
  const ing=Array(N).fill(0), egr=Array(N).fill(0);
  const eng=Array(N).fill(0), esc=Array(N).fill(0);
  const fT=Array(N).fill(0), fP=Array(N).fill(0), fC=Array(N).fill(0), fF=Array(N).fill(0);
  fT[0]=terrenoTotal; egr[0]+=terrenoTotal;
  const preM=Math.max(1,Math.min(vstart-1,N-1));
  for(let i=0;i<preM;i++){const v=prelim/preM;fP[i]+=v;egr[i]+=v;}
  const conEnd=Math.min(Math.round(meses*0.7),N-1);
  const conPM=construc/Math.max(1,conEnd);
  for(let i=1;i<=conEnd;i++){fC[i]=conPM;egr[i]+=conPM;}
  const cfiPM=cfijo/Math.max(1,meses);
  for(let i=1;i<N;i++){fF[i]=cfiPM;egr[i]+=cfiPM;}
  const vS=Math.min(vstart,N-1), vE=Math.min(vstart+vDur-1,N-1), vM=Math.max(1,vE-vS+1);
  const vCont=ventas*pctCont, vFin=ventas*(1-pctCont);
  for(let i=vS;i<=vE;i++){const e=vCont/vM*ecPct+vFin/vM*efPct;eng[i]=e;ing[i]+=e;}
  const eS=Math.max(N-3,vS), eN=N-eS;
  for(let i=eS;i<N;i++){const s=vCont*wcPct/eN+vFin*wfPct/eN;esc[i]=s;ing[i]+=s;}
  const acum=Array(N).fill(0); let acc=0;
  for(let i=0;i<N;i++){acc+=ing[i]-egr[i];acum[i]=acc;}
  const neto=ing.map((v,i)=>v-egr[i]);
  const labels=Array.from({length:N},(_,i)=>'M'+i);

  $('contentArea').innerHTML=`
<div class="fl-toolbar"><label>Vista</label>
  <select onchange="filterFlujo(this.value)"><option value="all">Detalle completo</option><option value="main">Solo totales</option></select>
</div>
<div class="legend">
  <div class="li"><div class="ld" style="background:#2a6b45"></div>Ingresos</div>
  <div class="li"><div class="ld" style="background:#8b2e2e"></div>Egresos</div>
  <div class="li"><div class="ld" style="background:#555"></div>Caja Acumulada</div>
</div>
<div class="chart-card"><canvas id="fc"></canvas></div>
<div class="fw"><table class="ft" id="ftbl"><thead><tr id="fth"><th>Concepto</th></tr></thead><tbody id="ftb"></tbody></table></div>
<div class="sum-row">
  <div class="src"><div class="sl">Capital</div><div class="sv">${fmt(cap)}</div></div>
  <div class="src"><div class="sl">Crédito Bancario</div><div class="sv">${fmt(banco)}</div></div>
  <div class="src"><div class="sl">Costo Fin. ${tasa}%</div><div class="sv">${fmt(costoFin)}</div></div>
  <div class="src"><div class="sl">Utilidad Neta</div><div class="sv g">${fmt(util)}</div></div>
</div>`;

  labels.forEach(l=>{const th=document.createElement('th');th.textContent=l;$('fth').appendChild(th);});
  const rows=[
    {l:'INGRESOS',cls:'frs',sec:true,main:true},
    {l:'Enganches',d:eng},{l:'Escrituras',d:esc},
    {l:'Total Ingresos',d:ing,cls:'fri',main:true},
    {l:'EGRESOS',cls:'frs',sec:true,main:true},
    {l:'Terreno',d:fT},{l:'Preliminares',d:fP},{l:'Construcción',d:fC},{l:'Costo Fijo',d:fF},
    {l:'Total Egresos',d:egr,cls:'fre',main:true},
    {l:'NETO MENSUAL',d:neto,cls:'frn',main:true,sgn:true},
    {l:'CAJA ACUMULADA',d:acum,cls:'fra',main:true,sgn:true},
  ];
  const tb=$('ftb');
  rows.forEach(r=>{
    const tr=document.createElement('tr');tr.className=r.cls||'';
    if(r.main)tr.dataset.main='1';
    const td0=document.createElement('td');td0.textContent=r.l;tr.appendChild(td0);
    if(r.sec){labels.forEach(()=>{const td=document.createElement('td');td.textContent='';tr.appendChild(td);});tr.className='frs';}
    else{r.d.forEach(v=>{const td=document.createElement('td');td.textContent=fmt(v);if(r.sgn&&v>0)td.className='pos';if(r.sgn&&v<0)td.className='neg';tr.appendChild(td);});}
    tb.appendChild(tr);
  });
  const ctx=$('fc').getContext('2d');
  chartInst=new Chart(ctx,{type:'bar',data:{labels,datasets:[
    {label:'Ingresos',data:ing,backgroundColor:'rgba(42,107,69,.75)',order:2},
    {label:'Egresos',data:egr.map(v=>-v),backgroundColor:'rgba(139,46,46,.65)',order:2},
    {label:'Caja Acumulada',data:acum,type:'line',borderColor:'#555',backgroundColor:'rgba(85,85,85,.07)',borderWidth:2,pointRadius:1.5,tension:.3,order:1,yAxisID:'y2'},
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:'#111',titleColor:'#ccc',bodyColor:'#ccc',titleFont:{family:'Montserrat'},bodyFont:{family:'Montserrat'},callbacks:{label:c=>' '+c.dataset.label+': '+fmt(c.parsed.y)}}},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{family:'Montserrat',size:9},color:'#aaa',maxRotation:0}},y:{stacked:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:'Montserrat',size:9},color:'#aaa',callback:v=>fmt(v)}},y2:{position:'right',grid:{display:false},ticks:{font:{family:'Montserrat',size:9},color:'#777',callback:v=>fmt(v)}}}}});
}
function filterFlujo(val){document.querySelectorAll('#ftb tr').forEach(tr=>{if(val==='main')tr.style.display=(tr.dataset.main||tr.className==='frs')?'':'none';else tr.style.display='';});}

// ── SAVE ──
function scheduleSave(){clearTimeout(saveTimer);setSave('saving');saveTimer=setTimeout(saveProject,1200);}
async function saveProject(){
  const p=projects.find(x=>x.id===activeProjId); if(!p)return;
  const tipos=getTipos();
  const row={
    name:      $('f-g-name')?.value||p.name,
    escenario: $('f-g-esc')?.value||p.escenario,
    meses:     nv('f-g-meses')||p.meses,
    tasa:      nv('f-g-tasa')||p.tasa,
    vstart:    nv('f-g-vstart')||p.vstart,
    v_dur:     nv('f-v-dur')||p.v_dur,
    pct_contado: nv('f-v-pct')||p.pct_contado,
    ec_pct:    nv('f-v-ec')||p.ec_pct,
    wc_pct:    nv('f-v-wc')||p.wc_pct,
    ef_pct:    nv('f-v-ef')||p.ef_pct,
    wf_pct:    nv('f-v-wf')||p.wf_pct,
    capital:   nv('f-v-cap')||p.capital,
    banco:     nv('f-v-banco')||p.banco,
    tipos:     tipos.length?tipos:p.tipos,
    e_m2:      nv('f-e-m2')||p.e_m2,
    terr_m2:   nv('f-t-m2')||p.terr_m2,
    terr_cus:  nv('f-t-cus')||p.terr_cus,
    terr_amen: nv('f-t-amen')||p.terr_amen,
    terr_pct:  nv('f-t-pct')||p.terr_pct,
    terr_fidpct: nv('f-t-fidpct')||p.terr_fidpct,
    c_br:  nv('f-c-br')||p.c_br,   c_dep: nv('f-c-dep')||p.c_dep,
    c_est: nv('f-c-est')||p.c_est, c_gest:nv('f-c-gest')||p.c_gest,
    c_fia: nv('f-c-fia')||p.c_fia, c_sia: nv('f-c-sia')||p.c_sia,
    c_pe:  nv('f-c-pe')||p.c_pe,   c_ind: nv('f-c-ind')||p.c_ind,
    c_leg: nv('f-c-leg')||p.c_leg, c_imp: nv('f-c-imp')||p.c_imp,
    c_mant:nv('f-c-mant')||p.c_mant,
    c_pm:  nv('f-c-pm')||p.c_pm,   c_mkt: nv('f-c-mkt')||p.c_mkt,
    c_com: nv('f-c-com')||p.c_com, c_gv:  nv('f-c-gv')||p.c_gv,
  };
  const {error}=await supa.from('projects').update(row).eq('id',p.id);
  if(error){setSave('');toast('Error al guardar','err');return;}
  Object.assign(p,row);
  setSave('saved'); setTimeout(()=>setSave(''),3000);
}

// ── NEW PROJECT ──
function openNewProject(){$('np-name').value='';$('npOverlay').classList.add('open');setTimeout(()=>$('np-name').focus(),100);}
function closeNewProject(){$('npOverlay').classList.remove('open');}
async function createNewProject(){
  const name=$('np-name').value.trim(); if(!name){$('np-name').focus();return;}
  const {data,error}=await supa.from('projects').insert([{name,escenario:$('np-esc').value}]).select().single();
  if(error){toast('Error al crear','err');return;}
  projects.push(data); activeProjId=data.id; activeView='resumen';
  renderSidebar(); renderView(); closeNewProject(); toast('Proyecto creado ✓');
}

// ── DELETE ──
function openDelete(id,name){deleteTargetId=id;$('delMsg').textContent=`¿Eliminar "${name}"? Esta acción no se puede deshacer.`;$('delOverlay').classList.add('open');}
function closeDelete(){deleteTargetId=null;$('delOverlay').classList.remove('open');}
async function confirmDelete(){
  if(!deleteTargetId)return;
  const {error}=await supa.from('projects').delete().eq('id',deleteTargetId);
  if(error){toast('Error al eliminar','err');closeDelete();return;}
  projects=projects.filter(p=>p.id!==deleteTargetId);
  if(activeProjId===deleteTargetId){activeProjId=null;showEmpty();}
  closeDelete(); renderSidebar(); toast('Proyecto eliminado');
}

loadProjects();

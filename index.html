<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proformas</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sw:260px;--th:52px;
  --bg:#f5f5f3;--white:#fff;
  --ink:#111110;--ink2:#3a3a38;--ink3:#6b6b69;--ink4:#a0a09e;
  --border:1px solid #e4e4e0;
  --sb:#141413;--sb-b:#242422;--sb-t:#888886;
  --green:#1d5c38;--red-bg:#fdf4f4;
  --r:6px;
}
html,body{height:100%;font-family:'Montserrat',sans-serif;font-size:13px;background:var(--bg);color:var(--ink);display:flex;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:var(--sw);background:var(--sb);display:flex;flex-direction:column;height:100vh;flex-shrink:0;border-right:1px solid var(--sb-b)}
.sb-head{padding:22px 20px 18px;border-bottom:1px solid var(--sb-b);flex-shrink:0}
.sb-head .lbl{font-size:9px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:#333331;margin-bottom:2px}
.sb-head .ttl{font-size:15px;font-weight:700;color:#fff}
.btn-new{margin:12px 14px;display:flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;color:var(--ink);border:none;border-radius:var(--r);font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;flex-shrink:0}
.btn-new:hover{background:#e8e8e4}
.sb-scroll{flex:1;overflow-y:auto;padding:4px 0 16px}
.sb-scroll::-webkit-scrollbar{width:3px}
.sb-scroll::-webkit-scrollbar-thumb{background:#2a2a28;border-radius:2px}
.sb-sec{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#2e2e2c;padding:12px 20px 6px}
.sb-proj{margin:2px 8px;border-radius:var(--r)}
.sb-ph{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;border-radius:var(--r);transition:background .12s}
.sb-ph:hover{background:rgba(255,255,255,.05)}
.sb-ph.open{background:rgba(255,255,255,.08)}
.sb-pn{font-size:12px;font-weight:500;color:#aaa;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-ph.open .sb-pn{color:#fff}
.sb-chev{color:#3a3a38;transition:transform .2s;flex-shrink:0;margin-left:4px}
.sb-ph.open .sb-chev{transform:rotate(90deg);color:#666}
.sb-del{display:none;background:none;border:none;cursor:pointer;color:#444;padding:2px 3px;border-radius:3px;transition:color .15s;flex-shrink:0}
.sb-ph:hover .sb-del{display:flex}
.sb-del:hover{color:#e07070}
.sb-sub{display:none;padding:2px 0 4px}
.sb-sub.open{display:block}
.sb-si{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 26px;cursor:pointer;font-size:11px;color:var(--sb-t);border-radius:5px;margin:1px 8px;transition:background .12s,color .12s;border-left:2px solid transparent}
.sb-si:hover{color:#ccc;background:rgba(255,255,255,.04)}
.sb-si.active{color:#fff;font-weight:500;border-left-color:#fff;background:rgba(255,255,255,.07)}
.sb-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0}
.sb-si.active .sb-dot{opacity:1}
.sb-empty{padding:12px 20px;font-size:11px;color:#3a3a38;font-style:italic}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--th);background:var(--white);border-bottom:var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;flex-shrink:0}
.tb-left{display:flex;align-items:center;gap:8px}
.tb-crumb{font-size:12px;color:var(--ink3)}
.tb-crumb.cur{color:var(--ink);font-weight:600}
.tb-sep{color:var(--ink4)}
.tb-right{display:flex;align-items:center;gap:14px}
.save-status{font-size:11px;color:var(--ink4);display:flex;align-items:center;gap:6px}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--ink4);animation:pulse 1s infinite;display:none}
.save-dot.show{display:block}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.content{flex:1;overflow-y:auto;padding:28px 32px 80px}

/* ── EMPTY STATE ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--ink3)}
.empty svg{margin-bottom:14px;opacity:.2}
.empty h2{font-size:15px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.empty p{font-size:12px;max-width:280px;line-height:1.6}

/* ── TABS ── */
.tab-bar{display:flex;gap:0;border-bottom:var(--border);margin-bottom:24px;background:var(--white);border-radius:var(--r) var(--r) 0 0;overflow:hidden;border:var(--border)}
.tab-btn{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;padding:11px 20px;border:none;background:transparent;color:var(--ink4);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.3px}
.tab-btn:hover{color:var(--ink2)}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--ink)}
.tab-panel{display:none}.tab-panel.active{display:block}

/* ── KPI ROW ── */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:var(--border);border-radius:var(--r);overflow:hidden;background:#e4e4e0;margin-bottom:22px}
.kc{background:var(--white);padding:16px 18px;border-right:var(--border)}
.kc:last-child{border-right:none}
.kc .kl{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink4);margin-bottom:5px}
.kc .kv{font-size:19px;font-weight:700;color:var(--ink);line-height:1}
.kc .kv.g{color:var(--green)}
.kc .ks{font-size:10px;color:var(--ink4);margin-top:3px}

/* ── PROFORMA LAYOUT ── */
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.card{background:var(--white);border:var(--border);border-radius:var(--r);padding:20px 22px}
.card-full{background:var(--white);border:var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:18px}
.ct{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--ink4);margin-bottom:14px;padding-bottom:10px;border-bottom:var(--border)}

/* ── EDITABLE TABLE ── */
.etbl{width:100%;border-collapse:collapse}
.etbl th{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--ink4);text-align:left;padding:5px 10px 7px;border-bottom:var(--border)}
.etbl th.r{text-align:right}
.etbl td{padding:4px 6px;border-bottom:1px solid #f0f0ec;font-size:12px;vertical-align:middle}
.etbl td.r{text-align:right}
.etbl td.label{color:var(--ink2);padding-left:10px}
.etbl td.computed{text-align:right;font-weight:600;color:var(--ink);padding-right:10px}
.etbl td.pct-col{text-align:right;color:var(--ink4);font-size:11px;padding-right:10px;width:70px}
.etbl tr:last-child td{border-bottom:none}
.etbl .tg td{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink4);padding:12px 10px 4px;border-bottom:none;background:transparent}
.etbl .ts td{background:#f5f5f3;font-weight:700;border-top:var(--border);font-size:12px}
.etbl .tt td{background:var(--ink);color:#fff;font-weight:700}
.etbl .tu td{background:var(--green);color:#fff;font-weight:700}
.etbl .tr-name td{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff;padding:8px 10px 5px;border-bottom:none;background:var(--ink2)}

/* ── EDITABLE INPUT ── */
.ef{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:500;border:1px solid transparent;border-radius:4px;padding:5px 8px;color:var(--ink);background:transparent;text-align:right;width:100%;transition:all .15s;-moz-appearance:textfield}
.ef::-webkit-outer-spin-button,.ef::-webkit-inner-spin-button{-webkit-appearance:none}
.ef:hover{border-color:#e4e4e0;background:#fafaf8}
.ef:focus{border-color:#aaa;background:#fff;outline:none;box-shadow:0 0 0 2px rgba(0,0,0,.06)}
.ef.name-input{font-size:14px;font-weight:700;text-align:left;padding:4px 8px;width:200px}
input[type=text].ef{text-align:left}

/* Tipo rows */
.tipo-header{display:grid;grid-template-columns:1fr 80px 90px 100px 100px 28px;gap:6px;padding:0 10px 4px;font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--ink4)}
.tipo-row{display:grid;grid-template-columns:1fr 80px 90px 100px 100px 28px;gap:6px;padding:4px 10px;border-bottom:1px solid #f0f0ec;align-items:center}
.tipo-row:last-child{border-bottom:none}
.tipo-total{font-size:12px;font-weight:600;color:var(--ink);text-align:right}
.btn-add-tipo{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;padding:6px 12px;border:var(--border);border-radius:5px;background:transparent;color:var(--ink3);cursor:pointer;margin-top:10px;display:block}
.btn-add-tipo:hover{background:#f5f5f3}
.btn-rm{background:none;border:none;cursor:pointer;color:#ccc;font-size:16px;padding:0;line-height:1;transition:color .15s}
.btn-rm:hover{color:#e07070}

/* Bar */
.bar{display:inline-block;height:4px;background:var(--ink3);border-radius:1px;vertical-align:middle;margin-right:5px;opacity:.25}

/* ── FLUJO ── */
.fl-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.fl-toolbar label{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink4)}
.fl-toolbar select{font-family:'Montserrat',sans-serif;font-size:11px;background:var(--white);border:var(--border);border-radius:5px;padding:6px 10px;color:var(--ink);cursor:pointer}
.legend{display:flex;gap:14px;margin-bottom:10px}
.li{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--ink4);font-weight:500}
.ld{width:10px;height:10px;border-radius:2px}
.chart-card{background:var(--white);border:var(--border);border-radius:var(--r);padding:18px 22px;margin-bottom:18px;height:195px;position:relative}
.chart-card canvas{width:100%!important;height:100%!important}
.fw{overflow-x:auto;background:var(--white);border:var(--border);border-radius:var(--r)}
.ft{border-collapse:collapse;font-size:11px;white-space:nowrap}
.ft th{background:var(--ink);color:#555;padding:8px 13px;text-align:right;font-weight:500;font-size:9px;position:sticky;top:0}
.ft th:first-child{text-align:left;min-width:185px;position:sticky;left:0;z-index:2;background:var(--ink)}
.ft td{padding:6px 13px;text-align:right;border-bottom:1px solid #f0f0ec}
.ft td:first-child{text-align:left;font-size:10px;font-weight:500;background:#f7f7f5;position:sticky;left:0;color:var(--ink2);border-right:var(--border)}
.ft .frs td{background:#1a1a18}.ft .frs td:first-child{background:#1a1a18;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#333;border-right:1px solid #252523}
.ft .fri td{background:#f0f7f3}
.ft .fre td{background:var(--red-bg)}
.ft .frn td{background:var(--ink);color:#888;font-weight:600}
.ft .frn td.pos{color:#6fcf97}.ft .frn td.neg{color:#e07070}
.ft .fra td{background:#0d0d0c;color:#444;font-weight:600}
.ft .fra td:first-child{background:#0d0d0c;border-right:1px solid #1a1a18}
.ft .fra td.pos{color:#6fcf97}.ft .fra td.neg{color:#e07070}
.sum-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:var(--border);border-radius:var(--r);overflow:hidden;background:#e4e4e0;margin-top:18px}
.src{background:var(--white);padding:14px 16px;border-right:var(--border)}
.src:last-child{border-right:none}
.src .sl{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink4);margin-bottom:4px}
.src .sv{font-size:15px;font-weight:700;color:var(--ink)}
.src .sv.g{color:var(--green)}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:var(--r);font-size:12px;font-weight:500;z-index:999;opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{background:#8b2e2e}

/* ── CONFIRM ── */
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
.confirm-overlay.open{display:flex}
.confirm-box{background:#fff;border-radius:8px;padding:26px;width:320px;box-shadow:0 16px 48px rgba(0,0,0,.2)}
.confirm-box h3{font-size:14px;font-weight:700;margin-bottom:6px}
.confirm-box p{font-size:12px;color:var(--ink3);line-height:1.5;margin-bottom:18px}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end}
.btn-cancel-sm{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;padding:8px 14px;border:var(--border);border-radius:5px;background:transparent;color:var(--ink3);cursor:pointer}
.btn-del-sm{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;padding:8px 14px;border:none;border-radius:5px;background:#8b2e2e;color:#fff;cursor:pointer}

/* ── NEW PROJECT MODAL ── */
.np-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
.np-overlay.open{display:flex}
.np-box{background:#fff;border-radius:8px;padding:28px;width:380px;box-shadow:0 16px 48px rgba(0,0,0,.2)}
.np-box h3{font-size:16px;font-weight:700;margin-bottom:6px}
.np-box p{font-size:12px;color:var(--ink3);margin-bottom:20px}
.np-row{margin-bottom:14px}
.np-row label{display:block;font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.np-row input,.np-row select{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:500;border:var(--border);border-radius:6px;padding:9px 11px;color:var(--ink);width:100%}
.np-row input:focus,.np-row select:focus{outline:none;border-color:#999}
.np-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn-np-cancel{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;padding:9px 16px;border:var(--border);border-radius:var(--r);background:transparent;color:var(--ink3);cursor:pointer}
.btn-np-create{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;padding:9px 20px;border:none;border-radius:var(--r);background:var(--ink);color:#fff;cursor:pointer}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-head">
    <div class="lbl">Plataforma</div>
    <div class="ttl">Proformas</div>
  </div>
  <button class="btn-new" onclick="openNewProject()">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Nuevo proyecto
  </button>
  <div class="sb-scroll">
    <div class="sb-sec">Proyectos</div>
    <div id="projList"><div class="sb-empty">Cargando...</div></div>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="tb-left" id="tbCrumb"><span class="tb-crumb cur">Selecciona un proyecto</span></div>
    <div class="tb-right">
      <div class="save-status" id="saveStatus">
        <div class="save-dot" id="saveDot"></div>
        <span id="saveText"></span>
      </div>
    </div>
  </div>
  <div class="content" id="contentArea">
    <div class="empty">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><rect x="5" y="7" width="34" height="30" rx="3" stroke="#111" stroke-width="2"/><path d="M12 17h20M12 23h20M12 29h11" stroke="#111" stroke-width="2" stroke-linecap="round"/></svg>
      <h2>Sin proyecto seleccionado</h2>
      <p>Elige un proyecto del sidebar o crea uno nuevo.</p>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- CONFIRM DELETE -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Eliminar proyecto</h3>
    <p id="confirmMsg">¿Estás seguro? Esta acción no se puede deshacer.</p>
    <div class="confirm-actions">
      <button class="btn-cancel-sm" onclick="closeConfirm()">Cancelar</button>
      <button class="btn-del-sm" onclick="confirmDelete()">Eliminar</button>
    </div>
  </div>
</div>

<!-- NEW PROJECT MODAL -->
<div class="np-overlay" id="npOverlay" onclick="npOutside(event)">
  <div class="np-box">
    <h3>Nuevo proyecto</h3>
    <p>Ingresa el nombre para crear la proforma en blanco.</p>
    <div class="np-row">
      <label>Nombre del proyecto</label>
      <input type="text" id="np-name" placeholder="Ej. Torre Andares" onkeydown="if(event.key==='Enter')createNewProject()">
    </div>
    <div class="np-row">
      <label>Escenario</label>
      <select id="np-esc">
        <option>Conservador</option>
        <option>Moderado</option>
        <option>Optimista</option>
      </select>
    </div>
    <div class="np-actions">
      <button class="btn-np-cancel" onclick="closeNewProject()">Cancelar</button>
      <button class="btn-np-create" onclick="createNewProject()">Crear →</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ═══════════════ SUPABASE ═══════════════
const SUPA_URL = 'https://ppdyogtveiltxzymdxsa.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZHlvZ3R2ZWlsdHh6eW1keHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODU2NjAsImV4cCI6MjA5NTY2MTY2MH0.Ard8M1RILsSXUILV8z7tq8fPXUhFFSMdPhm5Cgjk6pg';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

// ═══════════════ STATE ═══════════════
let projects = [];
let activeProjId = null, activeView = 'resumen';
let chartInst = null, saveTimer = null, deleteTargetId = null;
let tipoIdCounter = 0;

// ═══════════════ HELPERS ═══════════════
const fmt = v => { if(!v||v===0) return '—'; const s=v<0?'-':'',a=Math.abs(v); if(a>=1e6) return s+'$'+(a/1e6).toFixed(2)+'M'; if(a>=1e3) return s+'$'+Math.round(a/1000)+'K'; return s+'$'+Math.round(a).toLocaleString(); };
const fmtPct = (v,t) => t ? ((v/t)*100).toFixed(1)+'%' : '—';
const bw = (v,t) => t ? Math.min(Math.round((Math.abs(v)/t)*130),130) : 0;
const n = id => parseFloat(document.getElementById(id)?.value) || 0;

function toast(msg, type='ok') {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show'+(type==='err'?' err':'');
  setTimeout(()=>el.className='toast',3000);
}
function setSave(status) {
  const dot=document.getElementById('saveDot'), txt=document.getElementById('saveText');
  if(status==='saving'){dot.classList.add('show');txt.textContent='Guardando...';}
  else if(status==='saved'){dot.classList.remove('show');txt.textContent='Guardado ✓';}
  else{dot.classList.remove('show');txt.textContent='';}
}

// ═══════════════ LOAD ═══════════════
async function loadProjects() {
  const {data,error} = await supa.from('projects').select('*').order('created_at',{ascending:true});
  if(error){toast('Error al cargar','err');return;}
  projects = data||[];
  renderSidebar();
}

// ═══════════════ SIDEBAR ═══════════════
function renderSidebar() {
  const list=document.getElementById('projList');
  list.innerHTML='';
  if(!projects.length){list.innerHTML='<div class="sb-empty">Sin proyectos aún</div>';return;}
  projects.forEach(p=>{
    const isOpen=activeProjId===p.id;
    const div=document.createElement('div');
    div.className='sb-proj';
    div.innerHTML=`
      <div class="sb-ph ${isOpen?'open':''}" onclick="toggleProj('${p.id}')">
        <span class="sb-pn">${p.name}</span>
        <div style="display:flex;align-items:center;gap:3px">
          <button class="sb-del" onclick="event.stopPropagation();askDelete('${p.id}','${(p.name||'').replace(/'/g,"\\'")}')">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M4.5 3V2h3v1M5 5v4M7 5v4M2.5 3l.5 6.5h6L9.5 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

// ═══════════════ CALC ═══════════════
function calcFromDOM(p) {
  const tipos = getTiposFromDOM();
  const eCajones = n('f-e-cajones'), eM2 = n('f-e-m2'), ePrice = n('f-e-price');
  const m2br = eCajones * eM2;
  const m2c = tipos.reduce((a,t)=>a+t.n*t.m2,0);
  const ventasDep = tipos.reduce((a,t)=>a+t.n*t.m2*t.precio,0);
  const ventasEst = eCajones * ePrice;
  const ventas = ventasDep + ventasEst;

  const terrM2=n('f-t-m2'), terrP=n('f-t-price'), terrFid=n('f-t-fid');
  const terreno = terrM2*terrP + terrFid;

  const cBr=n('f-c-br'), cDep=n('f-c-dep');
  const construc = cBr*m2br + cDep*m2c;

  const pePct=n('f-c-pe'), indPct=n('f-c-ind'), impPct=n('f-c-imp'), legPct=n('f-c-leg'), mantPct=n('f-c-mant');
  const cfixConst = construc*(pePct+indPct+impPct+legPct+mantPct)/100;

  const pmPct=n('f-c-pm'), mktPct=n('f-c-mkt'), comPct=n('f-c-com'), gvPct=n('f-c-gv');
  const cfixVentas = ventas*(pmPct+mktPct+comPct+gvPct)/100;

  const estPct=n('f-c-est'), gestPct=n('f-c-gest'), fiaPct=n('f-c-fia'), siaPct=n('f-c-sia');
  const prelim = ventas*(estPct+gestPct+fiaPct+siaPct)/100;

  const cfijo = cfixConst+cfixVentas;
  const costo = terreno+prelim+construc+cfijo;
  const util = ventas-costo;

  const cap=n('f-v-cap'), banco=n('f-v-banco'), tasa=n('f-g-tasa')||14;
  const meses=n('f-g-meses')||24;
  const costoFin = banco*(tasa/100/12)*meses;
  const utilFin = util-costoFin;

  const pctCont=(n('f-v-pct')||30)/100;
  const units = tipos.reduce((a,t)=>a+t.n,0);

  return {
    tipos, eCajones, eM2, ePrice, m2br, m2c, ventas, ventasDep,
    terreno, construc, prelim, cfijo, costo, util,
    cap, banco, tasa, meses, costoFin, utilFin,
    pctCont, units,
    costos:{terreno,prelim,construc,cfijo}
  };
}

function getTiposFromDOM(){
  return Array.from(document.querySelectorAll('.tipo-data-row')).map(row=>{
    const id=row.dataset.id;
    return{
      id,
      label: document.getElementById('tl-'+id)?.value||'',
      n: parseFloat(document.getElementById('tn-'+id)?.value)||0,
      m2: parseFloat(document.getElementById('tm-'+id)?.value)||0,
      precio: parseFloat(document.getElementById('tp-'+id)?.value)||0,
    };
  }).filter(t=>t.n>0);
}

// Update KPIs and computed cells without re-rendering
function updateCalcs(){
  const c=calcFromDOM();
  // KPIs
  const kpis=[
    ['kpi-ventas', fmt(c.ventas), c.units+' unidades'],
    ['kpi-costo', fmt(c.costo), fmtPct(c.costo,c.ventas)+' sobre ventas'],
    ['kpi-util', fmt(c.util), fmtPct(c.util,c.ventas)+' margen'],
    ['kpi-inv', fmt(c.cap+c.banco), 'Capital + Banco'],
    ['kpi-rend', c.cap+c.banco?fmtPct(c.utilFin,c.cap+c.banco):'—', 'Util. / Inversión'],
  ];
  kpis.forEach(([id,v,s])=>{
    const el=document.getElementById(id); if(!el)return;
    const vEl=el.querySelector('.kv'), sEl=el.querySelector('.ks');
    if(vEl)vEl.textContent=v; if(sEl)sEl.textContent=s;
  });
  // Tipo subtotals
  Array.from(document.querySelectorAll('.tipo-data-row')).forEach(row=>{
    const id=row.dataset.id;
    const nn=parseFloat(document.getElementById('tn-'+id)?.value)||0;
    const mm=parseFloat(document.getElementById('tm-'+id)?.value)||0;
    const pp=parseFloat(document.getElementById('tp-'+id)?.value)||0;
    const el=document.getElementById('tt-'+id); if(el) el.textContent=fmt(nn*mm*pp);
  });
  // Computed cells
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('calc-terreno', fmt(c.terreno));
  set('calc-prelim', fmt(c.prelim));
  set('calc-construc', fmt(c.construc));
  set('calc-cfijo', fmt(c.cfijo));
  set('calc-costo', fmt(c.costo));
  set('calc-util', fmt(c.util));
  set('calc-terreno-pct', fmtPct(c.terreno,c.ventas));
  set('calc-prelim-pct', fmtPct(c.prelim,c.ventas));
  set('calc-construc-pct', fmtPct(c.construc,c.ventas));
  set('calc-cfijo-pct', fmtPct(c.cfijo,c.ventas));
  set('calc-costo-pct', fmtPct(c.costo,c.ventas));
  set('calc-util-pct', fmtPct(c.util,c.ventas));
  set('calc-costoFin', fmt(c.costoFin));
  set('calc-utilFin', fmt(c.utilFin));
  // Bar widths
  [['bar-terreno',c.terreno],['bar-prelim',c.prelim],['bar-construc',c.construc],['bar-cfijo',c.cfijo]].forEach(([id,v])=>{
    const el=document.getElementById(id); if(el) el.style.width=bw(v,c.ventas)+'px';
  });
  scheduleSave();
}

  <div class="tipo-header"><span>Tipo</span><span>Unidades</span><span>m²/depto</span><span>$/m²</span><span style="text-align:right">Subtotal</span><span></span></div>

  // Sync the second terreno computed cell

// ═══════════════ TIPO MANAGEMENT ═══════════════
function addTipo(){
  tipoIdCounter++;
  const tid=tipoIdCounter;
  const div=document.createElement('div');
  div.className='tipo-data-row'; div.dataset.id=tid;
  div.innerHTML=`
    <input class="ef" type="text" id="tl-${tid}" value="" placeholder="Tipo ${tid}" oninput="updateCalcs()">
    <input class="ef" type="number" id="tn-${tid}" value="" placeholder="0" oninput="updateCalcs()">
    <input class="ef" type="number" id="tm-${tid}" value="" placeholder="0" oninput="updateCalcs()">
    <input class="ef" type="number" id="tp-${tid}" value="" placeholder="0" oninput="updateCalcs()">
    <div class="tipo-total" id="tt-${tid}">—</div>
    <button class="btn-rm" onclick="removeTipo(${tid})">×</button>`;
  document.getElementById('tipoContainer').appendChild(div);
}
function removeTipo(id){
  const el=document.getElementById('tipoContainer').querySelector(`[data-id="${id}"]`);
  if(el){el.remove();updateCalcs();}
}

// ═══════════════ NAME UPDATE ═══════════════
function updateName(val){
  const p=projects.find(x=>x.id===activeProjId); if(!p)return;
  p.name=val;
  // Update sidebar name
  const el=document.querySelector(`[onclick="toggleProj('${activeProjId}')"] .sb-pn`);
  if(el)el.textContent=val;
  scheduleSave();
}

// ═══════════════ FLUJO ═══════════════
function renderFlujo(p){
  if(chartInst){chartInst.destroy();chartInst=null;}
  const tipos=p.tipos||[];
  const m2br=(p.e_cajones||0)*(p.e_m2||35);
  const m2c=tipos.reduce((a,t)=>a+(t.n||0)*(t.m2||0),0);
  const ventas=tipos.reduce((a,t)=>a+(t.n||0)*(t.m2||0)*(t.precio||0),0)+(p.e_cajones||0)*(p.e_price||0);
  const terreno=(p.terr_m2||0)*(p.terr_price||0)+(p.terr_fid||0);
  const construc=(p.c_br||0)*m2br+(p.c_dep||0)*m2c;
  const cfixConst=construc*((p.c_pe||0)+(p.c_ind||0)+(p.c_imp||0)+(p.c_leg||0)+(p.c_mant||0))/100;
  const cfixV=ventas*((p.c_pm||0)+(p.c_mkt||0)+(p.c_com||0)+(p.c_gv||0))/100;
  const prelim=ventas*((p.c_est||0)+(p.c_gest||0)+(p.c_fia||0)+(p.c_sia||0))/100;
  const cfijo=cfixConst+cfixV;
  const costo=terreno+prelim+construc+cfijo;
  const util=ventas-costo;
  const cap=p.capital||0, banco=p.banco||0, tasa=p.tasa||14;
  const meses=p.meses||24, vstart=p.vstart||1, vDur=p.v_dur||22;
  const pctCont=(p.pct_contado||30)/100;
  const costoFin=banco*(tasa/100/12)*meses;
  const ecPct=(p.ec_pct||90)/100, wcPct=(p.wc_pct||10)/100;
  const efPct=(p.ef_pct||35)/100, wfPct=(p.wf_pct||65)/100;

  // Generate flujo arrays
  const N=meses+1;
  const ing=Array(N).fill(0),egr=Array(N).fill(0);
  const eng=Array(N).fill(0),esc=Array(N).fill(0);
  const fT=Array(N).fill(0),fP=Array(N).fill(0),fC=Array(N).fill(0),fF=Array(N).fill(0);
  fT[0]=terreno; egr[0]+=terreno;
  const preM=Math.max(1,Math.min(vstart-1,N-1));
  for(let i=0;i<preM;i++){const v=prelim/preM;fP[i]=v;egr[i]+=v;}
  const conEnd=Math.min(Math.round(meses*0.7),N-1);
  const conPM=construc/Math.max(1,conEnd);
  for(let i=1;i<=conEnd;i++){fC[i]=conPM;egr[i]+=conPM;}
  const cfiPM=cfijo/Math.max(1,meses);
  for(let i=1;i<N;i++){fF[i]=cfiPM;egr[i]+=cfiPM;}
  const vS=Math.min(vstart,N-1),vE=Math.min(vstart+vDur-1,N-1),vM=Math.max(1,vE-vS+1);
  const vC=ventas*pctCont,vFin=ventas*(1-pctCont);
  for(let i=vS;i<=vE;i++){const e=vC/vM*ecPct+vFin/vM*efPct;eng[i]=e;ing[i]+=e;}
  const eS=Math.max(N-3,vS),eN=N-eS;
  for(let i=eS;i<N;i++){const s=vC*wcPct/eN+vFin*wfPct/eN;esc[i]=s;ing[i]+=s;}
  const acum=Array(N).fill(0);let acc=0;
  for(let i=0;i<N;i++){acc+=ing[i]-egr[i];acum[i]=acc;}
  const neto=ing.map((v,i)=>v-egr[i]);
  const labels=Array.from({length:N},(_,i)=>'M'+i);

  document.getElementById('contentArea').innerHTML=`
<div class="fl-toolbar"><label>Vista</label>
  <select onchange="filterFlujo(this.value)">
    <option value="all">Detalle completo</option>
    <option value="main">Solo totales</option>
  </select>
</div>
<div class="legend">
  <div class="li"><div class="ld" style="background:#2a6b45"></div>Ingresos</div>
  <div class="li"><div class="ld" style="background:#8b2e2e"></div>Egresos</div>
  <div class="li"><div class="ld" style="background:#555"></div>Caja Acumulada</div>
</div>
<div class="chart-card"><canvas id="fc"></canvas></div>
<div class="fw"><table class="ft" id="ftbl"><thead><tr id="fth"><th>Concepto</th></tr></thead><tbody id="ftb"></tbody></table></div>
<div class="sum-row">
  <div class="src"><div class="sl">Capital</div><div class="sv">${fmt(cap)}</div></div>
  <div class="src"><div class="sl">Crédito Bancario</div><div class="sv">${fmt(banco)}</div></div>
  <div class="src"><div class="sl">Costo Fin. ${tasa}%</div><div class="sv">${fmt(costoFin)}</div></div>
  <div class="src"><div class="sl">Utilidad Neta</div><div class="sv g">${fmt(util)}</div></div>
</div>`;

  labels.forEach(l=>{const th=document.createElement('th');th.textContent=l;document.getElementById('fth').appendChild(th);});
  const rows=[
    {l:'INGRESOS',cls:'frs',sec:true,main:true},
    {l:'Enganches',d:eng},{l:'Escrituras',d:esc},
    {l:'Total Ingresos',d:ing,cls:'fri',main:true},
    {l:'EGRESOS',cls:'frs',sec:true,main:true},
    {l:'Terreno',d:fT},{l:'Preliminares',d:fP},{l:'Construcción',d:fC},{l:'Costo Fijo',d:fF},
    {l:'Total Egresos',d:egr,cls:'fre',main:true},
    {l:'NETO MENSUAL',d:neto,cls:'frn',main:true,sgn:true},
    {l:'CAJA ACUMULADA',d:acum,cls:'fra',main:true,sgn:true},
  ];
  const tb=document.getElementById('ftb');
  rows.forEach(r=>{
    const tr=document.createElement('tr');tr.className=r.cls||'';
    if(r.main)tr.dataset.main='1';
    const td0=document.createElement('td');td0.textContent=r.l;tr.appendChild(td0);
    if(r.sec){labels.forEach(()=>{const td=document.createElement('td');td.textContent='';tr.appendChild(td);});tr.className='frs';}
    else{r.d.forEach(v=>{const td=document.createElement('td');td.textContent=fmt(v);if(r.sgn&&v>0)td.className='pos';if(r.sgn&&v<0)td.className='neg';tr.appendChild(td);});}
    tb.appendChild(tr);
  });
  const ctx=document.getElementById('fc').getContext('2d');
  chartInst=new Chart(ctx,{type:'bar',data:{labels,datasets:[
    {label:'Ingresos',data:ing,backgroundColor:'rgba(42,107,69,.75)',order:2},
    {label:'Egresos',data:egr.map(v=>-v),backgroundColor:'rgba(139,46,46,.65)',order:2},
    {label:'Caja Acumulada',data:acum,type:'line',borderColor:'#555',backgroundColor:'rgba(85,85,85,.07)',borderWidth:2,pointRadius:1.5,tension:.3,order:1,yAxisID:'y2'},
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:'#111',titleColor:'#ccc',bodyColor:'#ccc',titleFont:{family:'Montserrat'},bodyFont:{family:'Montserrat'},callbacks:{label:c=>' '+c.dataset.label+': '+fmt(c.parsed.y)}}},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{family:'Montserrat',size:9},color:'#aaa',maxRotation:0}},y:{stacked:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:'Montserrat',size:9},color:'#aaa',callback:v=>fmt(v)}},y2:{position:'right',grid:{display:false},ticks:{font:{family:'Montserrat',size:9},color:'#777',callback:v=>fmt(v)}}}}});
}
function filterFlujo(val){document.querySelectorAll('#ftb tr').forEach(tr=>{if(val==='main')tr.style.display=(tr.dataset.main||tr.className==='frs')?'':'none';else tr.style.display='';});}

// ═══════════════ SAVE TO SUPABASE ═══════════════
function scheduleSave(){
  clearTimeout(saveTimer);
  setSave('saving');
  saveTimer=setTimeout(saveProject, 1200);
}

async function saveProject(){
  const p=projects.find(x=>x.id===activeProjId); if(!p) return;
  const tipos=getTiposFromDOM();
  const row={
    name: document.getElementById('f-g-name')?.value || p.name,
    escenario: document.getElementById('f-g-esc')?.value || p.escenario,
    meses: n('f-g-meses')||p.meses||24,
    tasa: n('f-g-tasa')||p.tasa||14,
    vstart: n('f-g-vstart')||p.vstart||1,
    v_dur: n('f-v-dur')||p.v_dur||22,
    pct_contado: n('f-v-pct')||p.pct_contado||30,
    ec_pct: n('f-v-ec')||p.ec_pct||90,
    wc_pct: n('f-v-wc')||p.wc_pct||10,
    ef_pct: n('f-v-ef')||p.ef_pct||35,
    wf_pct: n('f-v-wf')||p.wf_pct||65,
    capital: n('f-v-cap')||p.capital||0,
    banco: n('f-v-banco')||p.banco||0,
    tipos: tipos.length ? tipos : p.tipos,
    e_cajones: n('f-e-cajones')||p.e_cajones||0,
    e_m2: n('f-e-m2')||p.e_m2||35,
    e_price: n('f-e-price')||p.e_price||0,
    c_br: n('f-c-br')||p.c_br||0,
    c_dep: n('f-c-dep')||p.c_dep||0,
    c_pe: n('f-c-pe')||p.c_pe||0,
    c_ind: n('f-c-ind')||p.c_ind||0,
    c_imp: n('f-c-imp')||p.c_imp||0,
    c_leg: n('f-c-leg')||p.c_leg||0,
    c_mant: n('f-c-mant')||p.c_mant||0,
    c_pm: n('f-c-pm')||p.c_pm||0,
    c_mkt: n('f-c-mkt')||p.c_mkt||0,
    c_com: n('f-c-com')||p.c_com||0,
    c_gv: n('f-c-gv')||p.c_gv||0,
    c_est: n('f-c-est')||p.c_est||0,
    c_gest: n('f-c-gest')||p.c_gest||0,
    c_fia: n('f-c-fia')||p.c_fia||0,
    c_sia: n('f-c-sia')||p.c_sia||0,
    terr_m2: n('f-t-m2')||p.terr_m2||0,
    terr_price: n('f-t-price')||p.terr_price||0,
    terr_fid: n('f-t-fid')||p.terr_fid||0,
    terr_cus: n('f-t-cus')||p.terr_cus||0,
    terr_amen: n('f-t-amen')||p.terr_amen||0,
  };
  const {error}=await supa.from('projects').update(row).eq('id',p.id);
  if(error){setSave('');toast('Error al guardar','err');return;}
  Object.assign(p,row);
  setSave('saved');
  setTimeout(()=>setSave(''),3000);
}

// ═══════════════ NEW PROJECT ═══════════════
function openNewProject(){document.getElementById('np-name').value='';document.getElementById('npOverlay').classList.add('open');setTimeout(()=>document.getElementById('np-name').focus(),100);}
function closeNewProject(){document.getElementById('npOverlay').classList.remove('open');}
function npOutside(e){if(e.target===document.getElementById('npOverlay'))closeNewProject();}

async function createNewProject(){
  const name=document.getElementById('np-name').value.trim();
  if(!name){document.getElementById('np-name').focus();return;}
  const escenario=document.getElementById('np-esc').value;
  setSave('saving');
  const {data,error}=await supa.from('projects').insert([{name,escenario}]).select().single();
  setSave('');
  if(error){toast('Error al crear proyecto','err');return;}
  projects.push(data);
  activeProjId=data.id; activeView='resumen';
  renderSidebar(); renderView();
  closeNewProject();
  toast('Proyecto creado ✓');
}

// ═══════════════ DELETE ═══════════════
function askDelete(id,name){
  deleteTargetId=id;
  document.getElementById('confirmMsg').textContent=`¿Eliminar "${name}"? Esta acción no se puede deshacer.`;
  document.getElementById('confirmOverlay').classList.add('open');
}
function closeConfirm(){deleteTargetId=null;document.getElementById('confirmOverlay').classList.remove('open');}
async function confirmDelete(){
  if(!deleteTargetId)return;
  const {error}=await supa.from('projects').delete().eq('id',deleteTargetId);
  if(error){toast('Error al eliminar','err');closeConfirm();return;}
  projects=projects.filter(p=>p.id!==deleteTargetId);
  if(activeProjId===deleteTargetId){activeProjId=null;showEmpty();}
  closeConfirm(); renderSidebar(); toast('Proyecto eliminado');
}

// ═══════════════ INIT ═══════════════
loadProjects();
